<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#03100b" />
<title>para você</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@200;300;400&display=swap" rel="stylesheet" />
<style>
/* =========================================================
   PALETA E TEMPO
   ========================================================= */
:root{
  --neon:#7cffb2;
  --neon-2:#c8ffe4;
  --ice:#edfff5;
  --muted:#a7cdbb;
  --speed:1;
  --flareAt:1.6;
  --ruleAt:2;
}

*,*::before,*::after{box-sizing:border-box}

html,body{min-height:100%}

body{
  margin:0;
  min-height:100dvh;
  display:grid;
  place-items:center;
  background:
    radial-gradient(120% 90% at 50% 0%, #082018 0%, #04120d 42%, #010806 100%);
  color:var(--ice);
  font-family:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  touch-action:manipulation;
}

/* =========================================================
   FUNDO: brilhos, vagalumes, vinheta
   ========================================================= */
#spores{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none;
  mix-blend-mode:screen;
  opacity:.9;
}

.aurora{
  position:fixed;
  inset:-25%;
  z-index:0;
  pointer-events:none;
  filter:blur(80px);
  opacity:.7;
}
.aurora span{
  position:absolute;
  width:46vmax;
  height:46vmax;
  border-radius:50%;
  background:radial-gradient(circle at 50% 50%, rgba(70,230,150,.20), transparent 62%);
  animation:drift 26s ease-in-out infinite;
}
.aurora span:nth-child(1){ top:-16%; left:-10%; }
.aurora span:nth-child(2){
  bottom:-24%; right:-12%;
  background:radial-gradient(circle at 50% 50%, rgba(30,150,130,.18), transparent 62%);
  animation-delay:-9s;
}
.aurora span:nth-child(3){
  top:32%; left:66%;
  width:30vmax; height:30vmax;
  background:radial-gradient(circle at 50% 50%, rgba(124,255,178,.14), transparent 60%);
  animation-delay:-16s;
}
@keyframes drift{
  0%,100%{ transform:translate3d(0,0,0) scale(1); }
  50%{ transform:translate3d(4vw,-3vh,0) scale(1.14); }
}

/* =========================================================
   DNA — hélice dupla 3D ao fundo (efeito espiral)
   Canvas com projeção em perspectiva: profundidade,
   desfoque e brilho variam conforme o eixo z.
   ========================================================= */
.dna-canvas{
  position:fixed;
  inset:0;
  z-index:1;
  width:100%;
  height:100%;
  pointer-events:none;
  opacity:0;
  transition:opacity 2.6s ease .3s;
}
.run .dna-canvas{ opacity:1; }

.vignette{
  position:fixed;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:radial-gradient(ellipse at 50% 46%, transparent 30%, rgba(0,0,0,.34) 74%, rgba(0,0,0,.62) 100%);
}

/* =========================================================
   PALCO CENTRAL
   ========================================================= */
.stage{
  position:relative;
  z-index:3;
  width:min(100% - 2.4rem, 62rem);
  padding:clamp(1.4rem,5vh,3.2rem) 0 clamp(3rem,8vh,4.5rem);
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

/* etiqueta superior */
.eyebrow{
  margin:0 0 clamp(1rem,3vh,1.9rem);
  display:flex;
  align-items:center;
  gap:1rem;
  font-size:clamp(.58rem,1.5vw,.72rem);
  font-weight:400;
  letter-spacing:.44em;
  text-transform:uppercase;
  color:var(--neon);
  opacity:0;
}
.eyebrow::before,
.eyebrow::after{
  content:"";
  width:clamp(16px,5vw,54px);
  height:1px;
  background:linear-gradient(90deg, transparent, var(--neon));
  opacity:.65;
}
.eyebrow::after{ background:linear-gradient(90deg, var(--neon), transparent); }
.run .eyebrow{
  animation:fadeUp calc(1s * var(--speed)) cubic-bezier(.2,.8,.2,1) calc(.9s * var(--speed)) both;
}

/* =========================================================
   FLOR
   ========================================================= */
.bloom-wrap{
  position:relative;
  width:clamp(200px, min(22vw, 24vh), 208px);
  aspect-ratio:1;
  display:grid;
  place-items:center;
  margin-bottom:clamp(.2rem,1.4vh,1rem);
}
.bloom{
  width:100%;
  height:100%;
  overflow:visible;
  position:relative;
  z-index:1;
  filter:
    drop-shadow(0 0 6px rgba(150,255,200,.45))
    drop-shadow(0 0 22px rgba(50,220,140,.30))
    drop-shadow(0 0 60px rgba(30,180,110,.20));
  animation:bob 9s ease-in-out calc(2.2s * var(--speed)) infinite;
}
.halo{
  position:absolute;
  inset:-50%;
  border-radius:50%;
  background:radial-gradient(circle, rgba(120,255,190,.26), rgba(40,200,130,.10) 45%, transparent 68%);
  filter:blur(8px);
  opacity:0;
  transform:scale(.5);
  pointer-events:none;
}
.run .halo{
  animation:
    haloIn calc(2s * var(--speed)) cubic-bezier(.2,.8,.2,1) calc(.55s * var(--speed)) both,
    haloPulse 7s ease-in-out calc(2.8s * var(--speed)) infinite;
}

.bloom .petal-grp{
  transform-box:fill-box;
  transform-origin:50% 100%;
  transform:scale(.06);
  opacity:0;
}
.run .petal-grp{
  animation:petalOpen calc(1.5s * var(--speed)) cubic-bezier(.18,.86,.25,1) calc(var(--d) * 1s * var(--speed)) both;
}

.bloom .vein{
  stroke-dasharray:100;
  stroke-dashoffset:100;
  opacity:.55;
}
.run .vein{
  animation:veinDraw calc(1s * var(--speed)) ease-out calc((var(--d) + .3) * 1s * var(--speed)) both;
}

.bloom .filament{
  stroke:#c9ffe4;
  stroke-width:.85;
  stroke-linecap:round;
  stroke-dasharray:30;
  stroke-dashoffset:30;
  opacity:.9;
}
.run .filament{
  animation:draw calc(.9s * var(--speed)) ease-out calc(var(--d) * 1s * var(--speed)) both;
}

.bloom .dust{
  fill:#f0fff6;
  opacity:0;
  transform-box:fill-box;
  transform-origin:50% 50%;
  filter:drop-shadow(0 0 3px rgba(180,255,215,.9));
}
.run .dust{
  animation:pop calc(.6s * var(--speed)) cubic-bezier(.2,1.6,.4,1) calc(var(--d) * 1s * var(--speed)) both;
}

.bloom .mote{
  fill:#dcffec;
  opacity:0;
  transform-box:fill-box;
  transform-origin:50% 50%;
  filter:drop-shadow(0 0 4px rgba(150,255,200,.9));
}
.run .mote{
  animation:mote calc(6s * var(--speed)) linear calc(var(--d) * 1s * var(--speed)) infinite;
}

.bloom .core{
  transform-box:fill-box;
  transform-origin:50% 50%;
  opacity:0;
}
.run .core{
  animation:coreIn calc(1.4s * var(--speed)) cubic-bezier(.2,.9,.2,1) calc(1.15s * var(--speed)) both;
}

.bloom .core-light{
  transform-box:fill-box;
  transform-origin:50% 50%;
  animation:pulse 4.4s ease-in-out infinite;
}

.bloom .aura{
  opacity:0;
  transform-box:fill-box;
  transform-origin:50% 50%;
}
.run .bloom .aura{
  animation:auraIn calc(2.4s * var(--speed)) ease-out calc(.4s * var(--speed)) both;
}

.spin{
  transform-box:fill-box;
  transform-origin:50% 50%;
  animation:spin 150s linear infinite;
}

/* =========================================================
   NOME
   ========================================================= */
.name-wrap{
  position:relative;
  width:100%;
  display:grid;
  place-items:center;
  padding-inline:.2em;
}
.flare{
  position:absolute;
  left:50%;
  top:50%;
  width:min(90vw, 60vmin);
  aspect-ratio:1;
  translate:-50% -50%;
  border-radius:50%;
  background:radial-gradient(circle, rgba(170,255,210,.34), rgba(60,220,150,.12) 42%, transparent 70%);
  filter:blur(34px);
  opacity:0;
  pointer-events:none;
  z-index:0;
}
.run .flare{
  animation:flare calc(2.6s * var(--speed)) ease-out calc(var(--flareAt) * 1s * var(--speed)) both;
}

.name{
  position:relative;
  z-index:1;
  margin:0;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:baseline;
  column-gap:.2em;
  row-gap:.04em;
  font-family:"Cormorant Garamond", "Playfair Display", Georgia, "Times New Roman", serif;
  font-style:italic;
  font-weight:300;
  font-size:clamp(3rem, min(13.5vw, 15vh), 9rem);
  line-height:.98;
  letter-spacing:.004em;
  color:var(--ice);
  text-wrap:balance;
  overflow-wrap:break-word;
  text-shadow:
    0 0 5px rgba(210,255,232,.65),
    0 0 18px rgba(120,255,186,.50),
    0 0 48px rgba(60,220,150,.38),
    0 0 110px rgba(30,170,110,.28);
}
.name .word{ display:inline-flex; }
.name .ltr{
  display:inline-block;
  opacity:0;
  will-change:transform, filter, opacity;
}
.run .name .ltr{
  animation:neonIn calc(1s * var(--speed)) cubic-bezier(.18,.85,.25,1) calc(var(--t) * 1s * var(--speed)) both;
}

/* =========================================================
   LINHA, MENSAGEM, ASSINATURA
   ========================================================= */
.rule{
  width:min(74%, 30rem);
  height:1px;
  margin:clamp(.9rem,2.4vh,1.6rem) 0 clamp(1rem,2.6vh,1.7rem);
  background:linear-gradient(90deg, transparent, var(--neon-2) 50%, transparent);
  box-shadow:0 0 10px rgba(124,255,178,.85), 0 0 26px rgba(124,255,178,.45);
  transform:scaleX(0);
  opacity:0;
}
.run .rule{
  animation:ruleIn calc(1.5s * var(--speed)) cubic-bezier(.2,.8,.2,1) calc(var(--ruleAt) * 1s * var(--speed)) both;
}

.message{
  margin:0;
  max-width:38ch;
  min-height:5.6em;
  font-weight:300;
  font-size:clamp(.94rem, 2.1vw, 1.1rem);
  line-height:1.78;
  letter-spacing:.012em;
  color:#cbead9;
  text-wrap:pretty;
  text-shadow:0 0 22px rgba(60,220,150,.20);
}
.message .caret{
  display:inline-block;
  width:0;
  height:1.05em;
  margin-left:.1em;
  vertical-align:-.14em;
  border-left:1.6px solid var(--neon);
  box-shadow:0 0 11px rgba(124,255,178,.9);
  animation:blink 1s steps(1,end) infinite;
  transition:opacity .6s ease;
}
.message .caret.off{ opacity:0; animation:none; }

.signature{
  margin:clamp(1.3rem,3.4vh,2.2rem) 0 0;
  font-family:"Cormorant Garamond", Georgia, serif;
  font-style:italic;
  font-size:clamp(.82rem,1.9vw,.98rem);
  letter-spacing:.06em;
  color:rgba(167,205,187,.72);
  opacity:0;
  transform:translateY(10px);
  transition:opacity 1.1s ease, transform 1.1s cubic-bezier(.2,.8,.2,1);
}
.signature.show{ opacity:1; transform:none; }

.hint{
  position:fixed;
  left:50%;
  bottom:max(1rem, env(safe-area-inset-bottom));
  translate:-50% 0;
  z-index:4;
  margin:0;
  font-size:.6rem;
  font-weight:300;
  letter-spacing:.32em;
  text-transform:uppercase;
  color:rgba(167,205,187,.5);
  opacity:0;
  pointer-events:none;
  transition:opacity .9s ease;
  white-space:nowrap;
}
.hint.show{ opacity:1; }

/* =========================================================
   KEYFRAMES
   ========================================================= */
@keyframes fadeUp{
  from{ opacity:0; transform:translateY(12px); }
  to{ opacity:1; transform:none; }
}

@keyframes petalOpen{
  0%{ opacity:0; transform:scale(.06) rotate(-12deg); }
  32%{ opacity:1; }
  72%{ transform:scale(1.05) rotate(1.6deg); }
  100%{ opacity:1; transform:scale(1) rotate(0deg); }
}
@keyframes veinDraw{ to{ stroke-dashoffset:0; } }
@keyframes draw{ to{ stroke-dashoffset:0; } }
@keyframes pop{
  0%{ opacity:0; transform:scale(0); }
  100%{ opacity:1; transform:scale(1); }
}
@keyframes mote{
  0%{ opacity:0; transform:translateY(8px) scale(.5); }
  16%{ opacity:.9; }
  70%{ opacity:.65; }
  100%{ opacity:0; transform:translateY(-30px) scale(.35); }
}
@keyframes coreIn{
  0%{ opacity:0; transform:scale(.15) rotate(-35deg); }
  60%{ opacity:1; }
  100%{ opacity:1; transform:scale(1) rotate(0deg); }
}
@keyframes auraIn{
  0%{ opacity:0; transform:scale(.5); }
  100%{ opacity:1; transform:scale(1); }
}
@keyframes haloIn{
  0%{ opacity:0; transform:scale(.45); }
  100%{ opacity:1; transform:scale(1); }
}
@keyframes haloPulse{
  0%,100%{ opacity:.78; transform:scale(1); }
  50%{ opacity:1; transform:scale(1.09); }
}
@keyframes pulse{
  0%,100%{ transform:scale(1); opacity:.95; }
  50%{ transform:scale(1.18); opacity:1; }
}
@keyframes spin{ to{ transform:rotate(360deg); } }
@keyframes bob{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-6px); }
}
@keyframes neonIn{
  0%{ opacity:0; transform:translate(-.1em,.26em) scale(1.1) rotate(1.5deg); filter:blur(15px) brightness(2.6); }
  28%{ opacity:.92; filter:blur(4px) brightness(1.95); }
  40%{ opacity:.22; }
  54%{ opacity:1; filter:blur(1.2px) brightness(1.4); }
  70%{ filter:blur(0) brightness(1.06); }
  100%{ opacity:1; transform:none; filter:blur(0) brightness(1); }
}
@keyframes flare{
  0%{ opacity:0; transform:scale(.35); }
  16%{ opacity:1; transform:scale(1.02); }
  100%{ opacity:.3; transform:scale(1.22); }
}
@keyframes ruleIn{
  0%{ transform:scaleX(0); opacity:0; }
  100%{ transform:scaleX(1); opacity:.85; }
}
@keyframes blink{
  0%,48%{ opacity:1; }
  49%,100%{ opacity:0; }
}

/* =========================================================
   TELAS BAIXAS (notebook pequeno / celular deitado)
   ========================================================= */
@media (max-height: 660px){
  .stage{ padding:1.1rem 0 2.2rem; }
  .eyebrow{ margin-bottom:.7rem; letter-spacing:.34em; }
  .bloom-wrap{ width:clamp(80px, 18vh, 118px); margin-bottom:.1rem; }
  .name{ font-size:clamp(2.3rem, min(11.5vw, 12.5vh), 5.2rem); }
  .rule{ margin:.7rem 0 .9rem; }
  .message{ font-size:.88rem; line-height:1.62; min-height:4.9em; }
  .signature{ margin-top:1rem; }
  .hint{ display:none; }
}

/* =========================================================
   ACESSIBILIDADE: menos movimento
   ========================================================= */
@media (prefers-reduced-motion: reduce){
  .aurora span,
  .spin,
  .bloom,
  .bloom .core-light,
  .dna-canvas{ transition:none; opacity:.85; }

  .run .eyebrow,
  .run .name .ltr,
  .run .petal-grp,
  .run .vein,
  .run .filament,
  .run .dust,
  .run .core,
  .run .bloom .aura,
  .run .halo,
  .run .flare,
  .run .rule{
    animation:none !important;
    opacity:1 !important;
    transform:none !important;
    filter:none !important;
    stroke-dashoffset:0 !important;
  }
  .bloom .aura{ opacity:1; }
  .bloom .mote{ display:none; }
  #spores{ display:none; }
}
</style>
</head>
<body>
<canvas id="spores" aria-hidden="true"></canvas>
<div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
<canvas class="dna-canvas" id="dnaCanvas" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<main class="stage" id="stage">
  <p class="eyebrow" id="eyebrow">Inovação · Pesquisa · Desenvolvimento</p>

  <div class="bloom-wrap" id="bloomWrap">
    <div class="halo" aria-hidden="true"></div>
    <svg class="bloom" id="bloom" viewBox="0 0 200 200" role="img" aria-label="Flor de luz se abrindo"></svg>
  </div>

  <div class="name-wrap">
    <div class="flare" aria-hidden="true"></div>
    <h1 class="name" id="name"></h1>
  </div>

  <div class="rule" aria-hidden="true"></div>
  <p class="message" id="message"></p>
  <p class="signature" id="signature"></p>
</main>

<p class="hint" id="hint">clique para repetir</p>

<noscript>
  <p style="position:fixed;inset:auto 0 2rem;text-align:center;color:#7cffb2;font-family:sans-serif">
    Ative o JavaScript para ver a animação.
  </p>
</noscript>

<script>
/* =========================================================
   1. PERSONALIZE AQUI  (ou use ?nome=...&msg=... na URL)
   ========================================================= */
const CONFIG = {
  nome:       "Carolina Fedrigo",
  sobre:      "Inovação · Pesquisa · Desenvolvimento",
  mensagem:   "Você decifra o código da vida e faz o mundo florescer. Entre milhões de combinações possíveis, a mais bonita é você.",
  assinatura: "feito com carinho — José Augusto ♥",
  ritmo:      1          // 1 = normal · 0.8 = mais rápido · 1.4 = mais lento
};
/* ========================================================= */

const qs = new URLSearchParams(location.search);
const cfg = {
  nome:       (qs.get("nome") || CONFIG.nome).trim(),
  sobre:      qs.get("sobre") || CONFIG.sobre,
  mensagem:   qs.get("msg") || CONFIG.mensagem,
  assinatura: qs.get("assinatura") || CONFIG.assinatura,
  ritmo:      Math.min(2.2, Math.max(.5, parseFloat(qs.get("ritmo")) || CONFIG.ritmo || 1))
};

const SPEED = cfg.ritmo;
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const root = document.documentElement;

const nameEl = document.getElementById("name");
const msgEl = document.getElementById("message");
const signEl = document.getElementById("signature");
const hintEl = document.getElementById("hint");
const bloomEl = document.getElementById("bloom");
const eyebrowEl = document.getElementById("eyebrow");

root.style.setProperty("--speed", String(SPEED));
document.title = cfg.nome + " 🌿";
eyebrowEl.textContent = cfg.sobre;
signEl.textContent = cfg.assinatura;

const isTouch = window.matchMedia("(hover: none)").matches;
hintEl.textContent = isTouch ? "toque para repetir" : "clique para repetir";

/* =========================================================
   2. RITMO DO ESPETÁCULO (em segundos, antes do multiplicador)
   ========================================================= */
const NAME_T0    = 1.15;   // quando a primeira letra acende
const LETTER_GAP = 0.115;  // intervalo entre letras
const LETTER_DUR = 1.0;

/* =========================================================
   DNA — HÉLICE DUPLA 3D AO FUNDO (EFEITO ESPIRAL)
   Projeção em perspectiva no canvas: profundidade (z),
   desfoque e brilho variam ao longo da hélice.
   No mobile as espirais ficam menores e nos cantos opostos.
   ========================================================= */
(function dnaLayer(){
  const cvs = document.getElementById("dnaCanvas");
  if (!cvs) return;
  const ctx = cvs.getContext("2d");

  const TAU = Math.PI * 2;
  const FOV = 1000;
  let W = 0, H = 0, DPR = 1;

  /* "átomos" pré-renderizados para ganho de performance */
  function makeDot(inner, mid){
    const c = document.createElement("canvas");
    c.width = c.height = 64;
    const g = c.getContext("2d");
    const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grd.addColorStop(0, inner);
    grd.addColorStop(.28, mid);
    grd.addColorStop(1, "rgba(60,220,150,0)");
    g.fillStyle = grd;
    g.fillRect(0, 0, 64, 64);
    return c;
  }
  const dotMint  = makeDot("rgba(240,255,244,.95)", "rgba(110,255,170,.75)");
  const dotGhost = makeDot("rgba(215,255,232,.80)", "rgba(80,230,150,.45)");

  const canFilter = typeof ctx.filter === "string";

  /* desktop: grandes, parcialmente fora da tela.
     mobile: pequenas, presas nos cantos opostos (não se sobrepõem). */
  const DESKTOP = [
    { fx: .86, fy: -.04, lenF: 1.42, amp: 118, turns: 3.15, rot: -19, spin:  .30, master: .62, blur: 2.2, yph: 0   },
    { fx: .07, fy: 1.04, lenF: 1.18, amp:  96, turns: 2.75, rot:  17, spin: -.24, master: .34, blur: 5.5, yph: 2.1 }
  ];
  const COMPACT = [
    { fx: 1.04, fy: .085, lenF: .54, amp: 42, turns: 2.3, rot: -13, spin:  .28, master: .52, blur: 1.6, yph: 0   },
    { fx: -.04, fy: .915, lenF: .50, amp: 36, turns: 2.1, rot:  13, spin: -.22, master: .30, blur: 4.5, yph: 2.1 }
  ];
  let helices = DESKTOP;

  function resize(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth;
    H = window.innerHeight;
    cvs.width  = Math.floor(W * DPR);
    cvs.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    helices = W < 640 ? COMPACT : DESKTOP;
  }
  window.addEventListener("resize", resize, { passive: true });
  resize();

  function project(h, s, strand){
    const len = h.lenF * H;
    const y3 = (s - .5) * len;
    const theta = s * h.turns * TAU + h.phase + strand * Math.PI;
    const x3 = Math.cos(theta) * h.amp;
    const z3 = Math.sin(theta) * h.amp;
    const p  = FOV / (FOV + z3);              // perspectiva: perto = maior
    const sx = x3 * p, sy = y3 * p;
    const rot = h.rot * Math.PI / 180;
    const cosR = Math.cos(rot), sinR = Math.sin(rot);
    return {
      x: h.cx + sx * cosR - sy * sinR,
      y: h.cy + sx * sinR + sy * cosR,
      d: (z3 + h.amp) / (2 * h.amp)           // 0 = longe · 1 = perto
    };
  }

  function drawHelix(h, t){
    h.cx = h.fx * W;
    h.cy = h.fy * H + Math.sin(t * .16 + h.yph) * (H * .012 + 6);
    h.phase = t * h.spin;

    if (canFilter) ctx.filter = h.blur > .4 ? "blur(" + h.blur + "px)" : "none";
    ctx.globalCompositeOperation = "lighter";

    const N = 150;
    const A = [], B = [];
    for (let i = 0; i <= N; i++){
      const s = i / N;
      A.push(project(h, s, 0));
      B.push(project(h, s, 1));
    }

    /* pares de bases (degraus da escada) */
    for (let i = 0; i <= N; i += 3){
      const a = A[i], b = B[i];
      const d = (a.d + b.d) / 2;
      ctx.strokeStyle = "rgba(124,255,178," + ((.035 + .30 * d * d) * h.master).toFixed(3) + ")";
      ctx.lineWidth = .5 + 2.1 * d;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      if (d > .45){
        const r = 1.8 + 4.8 * d;
        ctx.globalAlpha = (.20 + .62 * d) * h.master;
        ctx.drawImage(dotGhost, a.x - r, a.y - r, r * 2, r * 2);
        ctx.drawImage(dotGhost, b.x - r, b.y - r, r * 2, r * 2);
        ctx.globalAlpha = 1;
      }
    }

    /* fitas da dupla hélice: halo largo + núcleo brilhante */
    const cols = [[87, 240, 154], [214, 255, 230]];
    const strands = [A, B];
    for (let k = 0; k < 2; k++){
      const pts = strands[k];
      const c = cols[k];
      for (let i = 0; i < N; i++){
        const p0 = pts[i], p1 = pts[i + 1];
        const d = (p0.d + p1.d) / 2;
        const alpha = (.06 + .52 * Math.pow(d, 1.6)) * h.master;
        const w = .7 + 2.5 * d;
        ctx.strokeStyle = "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + (alpha * .30).toFixed(3) + ")";
        ctx.lineWidth = w * 3.6;
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.stroke();
        ctx.strokeStyle = "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + alpha.toFixed(3) + ")";
        ctx.lineWidth = w;
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.stroke();
      }
      /* esferas de fosfato ao longo da fita */
      for (let i = 0; i <= N; i += 5){
        const p = pts[i];
        const r = 1.3 + 5.4 * p.d;
        ctx.globalAlpha = (.16 + .72 * Math.pow(p.d, 1.5)) * h.master;
        ctx.drawImage(k === 0 ? dotMint : dotGhost, p.x - r, p.y - r, r * 2, r * 2);
      }
      ctx.globalAlpha = 1;
    }

    ctx.globalCompositeOperation = "source-over";
    if (canFilter) ctx.filter = "none";
  }

  function render(t){
    ctx.clearRect(0, 0, W, H);
    for (const h of helices) drawHelix(h, t);
  }

  if (reduce){
    render(1.7);                       // um quadro estático
    window.addEventListener("resize", () => render(1.7));
    return;
  }

  const start = performance.now();
  (function frame(now){
    render((now - start) / 1000);
    requestAnimationFrame(frame);
  })(start);
})();

/* =========================================================
   3. FLOR — SVG gerada (pétalas, estames, pólen)
   ========================================================= */
const PETAL = "M100 100 C120 82 128 52 100 16 C72 52 80 82 100 100 Z";

function bloomMarkup(){
  let back = "", outer = "", inner = "", stamen = "", dust = "", motes = "";

  for (let i = 0; i < 4; i++){
    const d = 0.16 + i * 0.05;
    back += `<g transform="rotate(${i * 90 + 22.5} 100 100) translate(100 100) scale(1.24) translate(-100 -100)">
      <g class="petal-grp" style="--d:${d.toFixed(3)}">
        <path d="${PETAL}" fill="url(#petalGradBack)" stroke="url(#petalStroke)" stroke-width=".9" stroke-opacity=".35" stroke-linejoin="round"/>
      </g>
    </g>`;
  }

  for (let i = 0; i < 8; i++){
    const d = 0.30 + i * 0.055;
    outer += `<g transform="rotate(${i * 45} 100 100)">
      <g class="petal-grp" style="--d:${d.toFixed(3)}">
        <path d="${PETAL}" fill="url(#petalGrad)" stroke="url(#petalStroke)" stroke-width="1.1" stroke-linejoin="round"/>
        <path class="vein" d="M100 95 C101 74 101 50 100 26" fill="none" stroke="#d9ffe9"
              stroke-width=".7" stroke-linecap="round" pathLength="100"/>
      </g>
    </g>`;
  }

  for (let i = 0; i < 8; i++){
    const d = 0.64 + i * 0.045;
    inner += `<g transform="rotate(${i * 45 + 22.5} 100 100) translate(100 100) scale(.58) translate(-100 -100)">
      <g class="petal-grp" style="--d:${d.toFixed(3)}">
        <path d="${PETAL}" fill="url(#petalGradInner)" stroke="url(#petalStroke)" stroke-width="1.6" stroke-linejoin="round"/>
      </g>
    </g>`;
  }

  const n = 12;
  for (let i = 0; i < n; i++){
    const a = (i / n) * Math.PI * 2 - Math.PI / 2;
    const x1 = 100 + Math.cos(a) * 7,   y1 = 100 + Math.sin(a) * 7;
    const x2 = 100 + Math.cos(a) * 24,  y2 = 100 + Math.sin(a) * 24;
    const dx = 100 + Math.cos(a) * 28,  dy = 100 + Math.sin(a) * 28;
    const d  = 1.05 + i * 0.035;
    stamen += `<line class="filament" x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}"
                x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" style="--d:${d.toFixed(3)}"/>`;
    dust += `<circle class="dust" cx="${dx.toFixed(2)}" cy="${dy.toFixed(2)}" r="1.7"
              style="--d:${(d + .18).toFixed(3)}"/>`;
  }

  for (let i = 0; i < 10; i++){
    const a = Math.random() * Math.PI * 2;
    const r = 42 + Math.random() * 54;
    const cx = 100 + Math.cos(a) * r;
    const cy = 100 + Math.sin(a) * r;
    motes += `<circle class="mote" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}"
               r="${(0.8 + Math.random() * 1.1).toFixed(2)}"
               style="--d:${(1.6 + i * 0.42 + Math.random() * .6).toFixed(2)}"/>`;
  }

  return `
  <defs>
    <radialGradient id="auraGrad">
      <stop offset="0%"  stop-color="#9dffc8" stop-opacity=".20"/>
      <stop offset="55%" stop-color="#2fe08d" stop-opacity=".09"/>
      <stop offset="100%" stop-color="#2fe08d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petalGradBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2ea576" stop-opacity=".20"/>
      <stop offset="65%"  stop-color="#0c4231" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#03120d" stop-opacity=".52"/>
    </linearGradient>
    <linearGradient id="petalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c9ffe2" stop-opacity=".92"/>
      <stop offset="30%"  stop-color="#46e79b" stop-opacity=".50"/>
      <stop offset="72%"  stop-color="#126a4b" stop-opacity=".62"/>
      <stop offset="100%" stop-color="#061e17" stop-opacity=".80"/>
    </linearGradient>
    <linearGradient id="petalGradInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#eafff2" stop-opacity=".85"/>
      <stop offset="45%"  stop-color="#7cffb2" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#0a3325" stop-opacity=".75"/>
    </linearGradient>
    <linearGradient id="petalStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#effff6" stop-opacity=".95"/>
      <stop offset="55%"  stop-color="#7cffb2" stop-opacity=".80"/>
      <stop offset="100%" stop-color="#7cffb2" stop-opacity=".30"/>
    </linearGradient>
    <radialGradient id="coreGrad">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="24%"  stop-color="#e2fff0"/>
      <stop offset="52%"  stop-color="#7cffb2" stop-opacity=".92"/>
      <stop offset="100%" stop-color="#2fe08d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle class="aura" cx="100" cy="100" r="88" fill="url(#auraGrad)"/>

  ${motes}

  <g class="spin">
    ${back}
    ${outer}
    ${inner}
    <g class="core">
      ${stamen}
      ${dust}
      <circle class="core-light" cx="100" cy="100" r="15" fill="url(#coreGrad)"/>
    </g>
  </g>`;
}

/* =========================================================
   4. NOME — uma letra por vez
   ========================================================= */
function buildName(){
  nameEl.textContent = "";
  nameEl.setAttribute("aria-label", cfg.nome);

  const words = cfg.nome.split(/\s+/).filter(Boolean);
  let index = 0;

  for (const word of words){
    const wordEl = document.createElement("span");
    wordEl.className = "word";
    wordEl.setAttribute("aria-hidden", "true");

    for (const ch of word){
      const letter = document.createElement("span");
      letter.className = "ltr";
      letter.textContent = ch;
      letter.style.setProperty("--t", (NAME_T0 + index * LETTER_GAP).toFixed(3));
      wordEl.appendChild(letter);
      index++;
    }
    nameEl.appendChild(wordEl);
  }
  return index;
}

/* =========================================================
   5. MENSAGEM — máquina de escrever
   ========================================================= */
let timers = [];
function later(fn, ms){
  timers.push(setTimeout(fn, Math.max(0, ms)));
}
function clearTimers(){
  timers.forEach(clearTimeout);
  timers = [];
}

function typeOut(text, onDone){
  msgEl.textContent = "";
  const typed = document.createElement("span");
  const caret = document.createElement("span");
  caret.className = "caret";
  msgEl.append(typed, caret);

  const chars = Array.from(text);
  let i = 0;

  const tick = () => {
    if (i >= chars.length){
      later(() => caret.classList.add("off"), 900);
      onDone && onDone();
      return;
    }
    const ch = chars[i];
    typed.textContent += ch;
    i++;

    let delay = 16 + Math.random() * 26;
    if (ch === " ") delay += 26;
    if (/[,;:]/.test(ch)) delay += 170;
    if (/[.!?]/.test(ch)) delay += 260;

    later(tick, delay * SPEED);
  };
  tick();
}

/* =========================================================
   6. SEQUÊNCIA COMPLETA
   ========================================================= */
function play(){
  const totalLetters = buildName();
  bloomEl.innerHTML = bloomMarkup();

  const lastLetter  = NAME_T0 + Math.max(0, totalLetters - 1) * LETTER_GAP;
  const nameEnd     = lastLetter + LETTER_DUR * 0.6;
  const msgAt       = nameEnd + 0.45;

  root.style.setProperty("--flareAt", (lastLetter + 0.05).toFixed(3));
  root.style.setProperty("--ruleAt",  (lastLetter + 0.50).toFixed(3));

  signEl.classList.remove("show");
  hintEl.classList.remove("show");
  msgEl.textContent = "";

  requestAnimationFrame(() => {
    document.body.classList.add("run");

    if (reduce){
      msgEl.textContent = cfg.mensagem;
      signEl.classList.add("show");
      hintEl.classList.add("show");
      return;
    }

    later(burstFromBloom, (NAME_T0 + 0.85) * SPEED * 1000);

    later(() => typeOut(cfg.mensagem, () => {
      signEl.classList.add("show");
      later(() => hintEl.classList.add("show"), 1400);
    }), msgAt * SPEED * 1000);
  });
}

function burstFromBloom(){
  if (!window.sporeBurst) return;
  const r = bloomEl.getBoundingClientRect();
  window.sporeBurst(r.left + r.width / 2, r.top + r.height / 2, 28);
}

function restart(){
  clearTimers();
  document.body.classList.remove("run");
  void document.body.offsetWidth;
  play();
}

/* =========================================================
   7. INTERAÇÃO
   ========================================================= */
let lastRestart = 0;
function requestRestart(){
  const now = Date.now();
  if (now - lastRestart < 500) return;
  lastRestart = now;
  restart();
}

document.addEventListener("click", requestRestart, { passive: true });
document.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "r" || k === " " || k === "enter"){
    e.preventDefault();
    requestRestart();
  }
});



/* =========================================================
   8. PARTÍCULAS (vagalumes + constelações + explosão)
   ========================================================= */
(function particles(){
  const cvs = document.getElementById("spores");
  if (!cvs) return;

  const ctx = cvs.getContext("2d");
  let W = 0, H = 0, DPR = 1;
  const seeds = [];
  const sparks = [];

  const sprite = document.createElement("canvas");
  sprite.width = sprite.height = 64;
  const sctx = sprite.getContext("2d");
  const grd = sctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0,   "rgba(235,255,245,1)");
  grd.addColorStop(.22, "rgba(150,255,200,.9)");
  grd.addColorStop(.55, "rgba(60,220,150,.28)");
  grd.addColorStop(1,   "rgba(60,220,150,0)");
  sctx.fillStyle = grd;
  sctx.fillRect(0, 0, 64, 64);

  function seedParticles(){
    seeds.length = 0;
    const count = Math.min(72, Math.max(26, Math.round(W * H / 24000)));
    for (let i = 0; i < count; i++){
      seeds.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: .7 + Math.random() * 2.1,
        vy: -(.12 + Math.random() * .42),
        vx: (Math.random() - .5) * .16,
        ph: Math.random() * Math.PI * 2,
        sp: .4 + Math.random() * .9,
        a: .22 + Math.random() * .5
      });
    }
  }

  function resize(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth;
    H = window.innerHeight;
    cvs.width  = Math.floor(W * DPR);
    cvs.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    seedParticles();
  }

  window.sporeBurst = function(x, y, n){
    if (reduce) return;
    n = n || 24;
    for (let i = 0; i < n; i++){
      const a = Math.random() * Math.PI * 2;
      const v = .6 + Math.random() * 2.7;
      const life = 55 + Math.random() * 75;
      sparks.push({
        x, y,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v - .5,
        size: 6 + Math.random() * 16,
        life, max: life
      });
    }
  };

  let last = performance.now();

  function frame(now){
    const dt = Math.min(3, (now - last) / 16.6667);
    last = now;

    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";

    /* teia molecular bem sutil */
    ctx.lineWidth = .6;
    for (let i = 0; i < seeds.length; i++){
      const p = seeds[i];
      for (let j = i + 1; j < seeds.length; j++){
        const q = seeds[j];
        const dx = p.x - q.x, dy = p.y - q.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < 15000){
          ctx.strokeStyle = "rgba(124,255,178," + ((1 - d2 / 15000) * .12).toFixed(3) + ")";
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          ctx.stroke();
        }
      }
    }

    for (const p of seeds){
      p.y += p.vy * dt;
      p.x += (p.vx + Math.sin(now / 2600 * p.sp + p.ph) * .2) * dt;
      if (p.y < -24){ p.y = H + 24; p.x = Math.random() * W; }
      if (p.x < -24) p.x = W + 24;
      if (p.x > W + 24) p.x = -24;

      const size = p.r * 7;
      ctx.globalAlpha = p.a * (.6 + .4 * Math.sin(now / 900 * p.sp + p.ph));
      ctx.drawImage(sprite, p.x - size / 2, p.y - size / 2, size, size);
    }
    ctx.globalAlpha = 1;

    for (let i = sparks.length - 1; i >= 0; i--){
      const s = sparks[i];
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.vx *= .985;
      s.vy = s.vy * .985 + .006 * dt;
      s.life -= dt;
      if (s.life <= 0){ sparks.splice(i, 1); continue; }
      const k = s.life / s.max;
      const size = s.size * (.35 + k * .9);
      ctx.globalAlpha = k * .85;
      ctx.drawImage(sprite, s.x - size / 2, s.y - size / 2, size, size);
    }
    ctx.globalAlpha = 1;

    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  resize();

  if (!reduce) requestAnimationFrame(frame);
})();

/* =========================================================
   9. START (espera as fontes para não "pular" o layout)
   ========================================================= */
Promise.race([
  (document.fonts && document.fonts.ready) || Promise.resolve(),
  new Promise((r) => setTimeout(r, 1400))
]).then(play);
</script>
